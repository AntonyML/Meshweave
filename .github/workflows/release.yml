name: release

on:
  push:
    tags: ["v*"]
  # Permite lanzar la release manualmente desde la pestaña Actions
  # (Run workflow). Si el campo de versión va vacío, se genera automática:
  # último tag vX.Y.Z +1 patch (ver scripts\version.ps1). El tag se crea si
  # no existe (action-gh-release).
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Versión (p.ej. 1.2.3, con o sin 'v'). VACÍO = automática (bump del último tag)."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Necesario para la versión automática (leer el último tag git).
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          # Instalador oficial de Inno Setup 6 (vía Chocolatey para CI).
          choco install innosetup -y --no-progress

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # Versión: la del tag pulsado (push), la manual (dispatch) o automática
      # si el campo va vacío. RELEASE_VERSION va sin 'v'; RELEASE_TAG con 'v'.
      - name: Resolver versión (manual o automática)
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $ver = "${{ github.ref_name }}".Trim().TrimStart('v')
          } else {
            $input = "${{ inputs.tag_name }}".Trim()
            if ($input) {
              $ver = $input.TrimStart('v')
            } else {
              $ver = (& scripts\version.ps1).Trim()
            }
          }
          Write-Host "Versión resuelta: $ver"
          "RELEASE_VERSION=$ver" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "RELEASE_TAG=v$ver" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      # build.ps1 hace: versión inyectada, pytest, PyInstaller (icono + versión),
      # instalador Inno (con la misma versión), ZIP portable y checksums.
      - name: Build (PyInstaller + Inno + zip + checksums)
        shell: pwsh
        run: |
          & scripts\build.ps1 -Version $env:RELEASE_VERSION

      # ⚡ Mirrors externos (Catbox + GoFile): cuando GitHub Releases va lento,
      # los usuarios pueden descargar el ZIP portable desde estos enlaces.
      - name: ⚡ Upload mirrors (Catbox + GoFile)
        shell: bash
        run: |
          ZIP_PATH=dist/Meshweave-portable-x64.zip
          if [ ! -f "$ZIP_PATH" ]; then
            echo "❌ No se encontró el ZIP portable"
            exit 1
          fi
          echo "⬆️ Subiendo: Meshweave-portable-x64.zip"
          # ── CATBOX ──
          echo "📤 Subiendo a Catbox..."
          CATBOX_URL=$(curl -s -F "reqtype=fileupload" -F "fileToUpload=@${ZIP_PATH}" https://catbox.moe/user/api.php)
          if echo "$CATBOX_URL" | grep -q "^https\?://"; then
            echo " ✅ $CATBOX_URL"
          else
            echo " ⚠️ Error: $CATBOX_URL"
            CATBOX_URL=""
          fi
          # ── GOFILE ──
          echo "📤 Subiendo a GoFile..."
          SERVER=$(curl -s https://api.gofile.io/servers | python -c "import sys, json; print(json.load(sys.stdin)['data']['servers'][0]['name'])")
          GOFILE_RESULT=$(curl -s -F "file=@${ZIP_PATH}" "https://${SERVER}.gofile.io/contents/uploadfile")
          GOFILE_URL=$(echo "$GOFILE_RESULT" | python -c "import sys, json; print(json.load(sys.stdin).get('data', {}).get('downloadPage', ''))")
          if [ -n "$GOFILE_URL" ]; then
            echo " ✅ $GOFILE_URL"
          else
            echo " ⚠️ Error: $GOFILE_RESULT"
            GOFILE_URL=""
          fi
          # ── GUARDAR URLs para el release body ──
          echo "CATBOX_URL=${CATBOX_URL:-}" >> "$GITHUB_ENV"
          echo "GOFILE_URL=${GOFILE_URL:-}" >> "$GITHUB_ENV"

      - name: 📝 Build release body with mirror links
        shell: bash
        run: |
          cp .github/release-template.md release-body.md
          echo "" >> release-body.md
          echo "---" >> release-body.md
          echo "" >> release-body.md
          echo "### ⚡ Descarga rápida (mirrors)" >> release-body.md
          echo "" >> release-body.md
          echo "| Mirror | Link |" >> release-body.md
          echo "|--------|------|" >> release-body.md
          if [ -n "${{ env.CATBOX_URL }}" ]; then
            echo "| 🐱 Catbox | [${{ env.CATBOX_URL }}](${{ env.CATBOX_URL }}) |" >> release-body.md
          fi
          if [ -n "${{ env.GOFILE_URL }}" ]; then
            echo "| 📁 GoFile | [${{ env.GOFILE_URL }}](${{ env.GOFILE_URL }}) |" >> release-body.md
          fi

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Push de tag → el tag pulsado; manual → el resuelto (se crea si falta).
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/Meshweave.exe
            dist/Meshweave-portable-x64.zip
            dist/installer/Meshweave-Setup-x64.exe
            dist/SHA256SUMS.txt
          body_path: release-body.md
          generate_release_notes: true
